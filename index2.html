       <h2> Lissabon (huvudstad)</h2>
         <img src="./bilder/lisabon-portugal-1.jpg" alt="">
     <figcaption>Lissabon är Portugals huvudstad och ligger vid floden Tejo nära Atlanten. Staden är känd för sina kullar, sitt milda klimat och sin långa historia. I Lissabon finns många populära turistställen, till exempel den gamla stadsdelen Alfama med sina smala gator och traditionell musik. Besökare kan också åka de berömda gula spårvagnarna och njuta av utsikten från olika utsiktsplatser. Kombinationen av kultur, historia och vackra vyer gör Lissabon till ett attraktivt resmål.</figcaption>

        <h2>Porto</h2>
       <img src="./bilder/1000_F_79650880_oelmmP6sQ0LjmZKeVV4gV1v7wy4BQvq4.jpg" alt="">
       <figcaption>Porto är en av Portugals största städer och ligger vid floden Douro i norra delen av landet. Staden är känd för sin historia, sina färgglada hus och det berömda portvinet. I Porto finns flera populära turistställen, till exempel den gamla stadsdelen Ribeira som är med på UNESCO:s världsarvslista. Besökare kan också gå över bron Dom Luís I och besöka vinkällare längs floden. Kombinationen av kultur, historia och vacker utsikt gör Porto till ett populärt resmål.</figcaption>
